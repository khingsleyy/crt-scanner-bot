name: CRT Scanner

on:
  schedule:
    # Every 15 minutes. If your repo is PRIVATE, change this to hourly ("7 * * * *")
    # or you will run out of free GitHub minutes. Public repos are unlimited.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        type: choice
        default: scan-dry
        options:
          - telegram-test
          - check
          - scan-dry
          - scan

permissions:
  contents: write # lets the bot save which alerts it already sent

concurrency:
  group: crt-scanner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TASK: ${{ github.event.inputs.task || 'scan' }}
      CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
      CAPITAL_EMAIL: ${{ secrets.CAPITAL_EMAIL }}
      CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
      CAPITAL_DEMO: ${{ vars.CAPITAL_DEMO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run
        run: node src/cli.js "$TASK"

      - name: Save state
        if: ${{ env.TASK == 'scan' }}
        run: |
          git config user.name "crt-scanner"
          git config user.email "crt-scanner@users.noreply.github.com"
          git add state/sent.json
          git diff --cached --quiet || (git commit -m "update sent alerts" && git pull --rebase && git push)
